<section class="relative min-h-[calc(100vh-5rem)] overflow-hidden">
  <img
    src="imagens/hero/powershell.webp"
    alt=""
    aria-hidden="true"
    class="absolute inset-0 h-full w-full object-cover"
  />
  <!-- Camada escura por cima da imagem (deixa o texto legível) -->
  <div class="absolute inset-0 bg-slate-900/85"></div>

  <!-- Conteúdo do Sobre — seu currículo entra aqui -->
  <div class="relative mx-auto max-w-4xl px-6 py-24 text-white">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-accent-400">Sobre</p>
    <h1 class="mt-3 text-4xl font-bold sm:text-5xl">Sobre mim</h1>
    <p class="mt-5 max-w-2xl text-lg text-slate-200">
      Aqui vai a sua apresentação: quem você é, sua stack, formação e
      experiências.
    </p>

    <!-- Chips da stack -->
    <div class="mt-8 flex flex-wrap gap-2">
      @for (t of stack; track t) {
        <span class="rounded-full border border-white/20 bg-white/10 px-3 py-1 text-sm font-medium text-white backdrop-blur">
          {{ t }}
        </span>
      }
    </div>
  </div>
</section>
