<section class="mx-auto max-w-6xl px-6 py-16 sm:py-20">
  <h1 class="mb-2 text-center text-3xl font-bold text-brand-700 sm:text-4xl">Arquiteturas</h1>
  <p class="mx-auto mb-12 max-w-2xl text-center text-slate-600">
    Como meus projetos são organizados por dentro — decisões técnicas e infraestrutura.
  </p>

  <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
    @for (a of itens; track a.titulo) {
      <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:shadow-md">
        <div class="mb-4 inline-flex h-11 w-11 items-center justify-center rounded-xl bg-brand-50 text-lg font-bold text-brand-600">
          {{ a.icone }}
        </div>
        <h3 class="text-lg font-bold text-brand-700">{{ a.titulo }}</h3>
        <p class="mt-2 text-sm text-slate-600">{{ a.descricao }}</p>
      </div>
    }
  </div>
</section>
