<div
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg"
>
  <!-- Prévia do projeto: clipe em loop (mudo) -->
  <div class="aspect-video overflow-hidden bg-slate-100">
    @if (midia) {
      <video
        [src]="midia"
        autoplay
        muted
        loop
        playsinline
        class="h-full w-full object-cover"
      ></video>
    } @else {
      <div class="flex h-full items-center justify-center bg-gradient-to-br from-brand-50 to-slate-100 text-sm text-slate-400">
        Prévia do projeto
      </div>
    }
  </div>

  <!-- Conteúdo -->
  <div class="flex flex-1 flex-col p-6">
    <h3 class="text-xl font-bold text-brand-700">{{ titulo }}</h3>
    <p class="mt-2 text-slate-600">{{ descricao }}</p>

    <!-- Badges das tecnologias -->
    <div class="mt-4 flex flex-wrap gap-2">
      @for (tec of tecnologias; track tec) {
        <span class="rounded-full bg-brand-50 px-3 py-1 text-xs font-medium text-brand-700">
          {{ tec }}
        </span>
      }
    </div>

    <!-- Botões (empurrados pro rodapé pra alinhar os cards) -->
    <div class="mt-auto flex gap-3 pt-6">
      @if (linkDemo) {
        <a
          [href]="linkDemo"
          target="_blank"
          rel="noopener"
          class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-700"
        >
          Ver ao vivo
        </a>
      }
      @if (linkRepo) {
        <a
          [href]="linkRepo"
          target="_blank"
          rel="noopener"
          class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
        >
          GitHub
        </a>
      }
    </div>
  </div>
</div>
